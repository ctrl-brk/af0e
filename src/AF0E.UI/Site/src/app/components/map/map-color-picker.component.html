<p-inputcolor [(ngModel)]="color" [disabled]="disabled()">
  <p-inputcolor-swatch (click)="cp.toggle($event)" style="cursor: pointer">
    <p-inputcolor-transparency-grid />
    <p-inputcolor-swatch-background />
  </p-inputcolor-swatch>

  <p-popover #cp>
    <div class="inputcolor-popover">
      <p-inputcolor-area>
        <p-inputcolor-area-background />
        <p-inputcolor-area-handle />
      </p-inputcolor-area>

      <p-inputcolor-slider>
        <p-inputcolor-transparency-grid />
        <p-inputcolor-slider-track />
        <p-inputcolor-slider-handle />
      </p-inputcolor-slider>

      <p-inputcolor-slider channel="alpha">
        <p-inputcolor-transparency-grid />
        <p-inputcolor-slider-track />
        <p-inputcolor-slider-handle />
      </p-inputcolor-slider>

      <input pInputColorInput channel="hex" />
    </div>
  </p-popover>
</p-inputcolor>
