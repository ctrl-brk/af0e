<main class="utils-grid-content">
  <p-card header="Grid Square Calculator">
    <div class="grid-form">
      <p-floatlabel>
        <input
          pInputText
          id="latitude"
          [(ngModel)]="latitude"
          (paste)="onPaste($event)"
        />
        <label for="latitude">Latitude</label>
      </p-floatlabel>

      <p-floatlabel>
        <input
          pInputText
          id="longitude"
          [(ngModel)]="longitude"
          (paste)="onPaste($event)"
        />
        <label for="longitude">Longitude</label>
      </p-floatlabel>

      <button
        pButton
        type="button"
        (click)="calculateGrid()"
        [disabled]="!latitude || !longitude"
      >
        <svg data-p-icon="calculator" aria-hidden="true"></svg>
        <span>Calculate</span>
      </button>

      <div class="grid-result">
        <div class="result-header">
          <label class="result-label">Grid Square:</label>
          @if (inputValid()) {
            <button
              pButton
              type="button"
              [text]="true"
              [rounded]="true"
              size="small"
              (click)="copyToClipboard()"
              pTooltip="Copy to clipboard"
              tooltipPosition="left"
              severity="info"
              aria-label="Copy to clipboard"
            >
              <svg data-p-icon="copy" aria-hidden="true"></svg>
            </button>
          }
        </div>
        <span class="result-value">{{ gridSquare() }}</span>
      </div>
    </div>
  </p-card>
</main>
